<div class="single-sidebar-widget popular-post-widget">
	<h4 class="popular-title">Popular Posts</h4>
	<div class="popular-post-list">
        {% for i in posts %}
		<div class="single-post-list d-flex flex-row align-items-center">
			<div class="thumb">
				<img style="width: 70px; height: 50px; object-fit: cover;" class="img-fluid" src="{{ i.image.url }}" alt="{{ i.title }}">
			</div>
			<div class="details">
				<a href="{% url 'blog:blog-post' i.id %}"><h6>{{ i.title }}</h6></a>
				<p>{{ i.created_at }}</p>
			</div>
		</div>
        {% endfor %}
	</div>
</div>
