{% load blog_tags %}
<div class="single-sidebar-widget post-category-widget">
	<h4 class="category-title">Post Catgories</h4>
	<ul class="cat-list">
	{% for i in tags %}
		<li>
			<div class="d-flex justify-content-between">
				<p>{{ i.name }}</p>
				<p>{{ i.post_count }}</p>
			</div>
		</li>
	{% endfor %}									
	</ul>
</div>
